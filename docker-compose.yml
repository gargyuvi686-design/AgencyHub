version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: agencyhub_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: agencyhub
      MYSQL_USER: agencyhub
      MYSQL_PASSWORD: agencyhub_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "agencyhub", "-pagencyhub_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Optional DB UI — open http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: agencyhub_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
